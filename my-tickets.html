<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your Ticket Verse digital tickets — QR-ready passes for movies, concerts, sports, and live events." />
  <title>My Tickets — Ticket Verse</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #0d1118;
      --card: rgba(255,255,255,0.06);
      --gold: #e5b860;
      --cyan: #22d3ee;
      --purple: #a855f7;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.12);
      --font-display: 'Playfair Display', serif;
      --font-body: 'DM Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.55; }
    #navbar {
      position: sticky; top: 0; z-index: 100; width: 100%;
      background: rgba(10,10,10,0.92); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 900; color: #fff; text-decoration: none; }
    .nav-logo span { color: var(--gold); }
    .nav-logo .logo-icon { width: 34px; height: 34px; background: linear-gradient(145deg, var(--gold), #c9a050); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .nav-links { display: flex; gap: 8px; list-style: none; align-items: center; flex-wrap: wrap; }
    .nav-links a { color: var(--muted); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: var(--cyan); }
    .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-family: var(--font-display); font-size: clamp(1.75rem, 4vw, 2.25rem); margin-bottom: 10px; }
    .sub { color: var(--muted); margin-bottom: 32px; font-size: 0.95rem; }
    .ticket-pass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.45), 0 0 60px rgba(168,85,247,0.06);
    }
    @media (max-width: 640px) { .ticket-pass { grid-template-columns: 1fr; } }
    .pass-main h2 { font-size: 1.1rem; margin-bottom: 8px; color: #fff; }
    .pass-meta { font-size: 0.85rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    .pass-ref { font-family: ui-monospace, monospace; color: var(--gold); font-size: 0.9rem; margin-top: 10px; }
    .qr-wrap {
      width: 120px; height: 120px;
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px rgba(34,211,238,0.15);
    }
    .qr-wrap svg { width: 100%; height: 100%; }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); border: 1px dashed var(--border); border-radius: 16px; }
    .empty a { color: var(--cyan); }
  </style>
</head>
<body>
  <nav id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">🎟</div>
        Ticket<span>Verse</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="index.html#events">Events</a></li>
        <li><a href="index.html#booking">Booking</a></li>
        <li><a href="my-tickets.html" class="active">My Tickets</a></li>
      </ul>
    </div>
  </nav>
  <div class="wrap">
    <h1>My Tickets</h1>
    <p class="sub">Digital passes — show this QR at the gate (demo placeholder pattern).</p>
    <div id="paidBanner" style="display:none;margin-bottom:20px;padding:14px 18px;border-radius:12px;border:1px solid rgba(34,211,238,0.35);background:rgba(34,211,238,0.08);font-size:0.9rem"></div>
    <div id="ticketList"></div>
  </div>
  <script>
    (function () {
      if (location.search.indexOf('paid=1') !== -1) {
        var b = document.getElementById('paidBanner');
        if (b) {
          b.style.display = 'block';
          b.textContent =
            'Payment captured — pass stored in your Ticket Verse vault. Pull this page up at the venue.';
        }
      }
      var list = document.getElementById('ticketList');
      var raw = localStorage.getItem('TV_TICKETS');
      var tickets = [];
      try { tickets = raw ? JSON.parse(raw) : []; } catch (e) {}
      if (!tickets.length) {
        list.innerHTML = '<div class="empty"><p>No tickets yet. Complete a booking and pay with PayPal to store a pass here.</p><p style="margin-top:16px"><a href="index.html#booking">Book an event</a></p></div>';
        return;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
      }
      list.innerHTML = tickets.map(function (t) {
        var id = esc(t.ref || t.eventId || 'TV');
        var qrId = 'qr-' + id.replace(/[^a-z0-9]/gi, '');
        return (
          '<article class="ticket-pass">' +
          '<div class="pass-main">' +
          '<h2>' + esc(t.eventTitle) + '</h2>' +
          '<div class="pass-meta">' +
          '<span>' + esc(String(t.ticketCount || 1)) + ' ticket(s) · ₹' + esc(String((t.total || 0).toLocaleString('en-IN'))) + '</span>' +
          '<span>' + esc(t.fname || '') + ' ' + esc(t.lname || '') + '</span>' +
          (t.paidAt ? '<span>Paid: ' + esc(new Date(t.paidAt).toLocaleString()) + '</span>' : '') +
          (t.paypalOrderId ? '<span>PayPal order: ' + esc(t.paypalOrderId) + '</span>' : '') +
          (t.razorpayPaymentId ? '<span>Razorpay payment: ' + esc(t.razorpayPaymentId) + '</span>' : '') +
          (t.razorpayOrderId ? '<span>Razorpay order: ' + esc(t.razorpayOrderId) + '</span>' : '') +
          '</div>' +
          '<div class="pass-ref">Ref: ' + id + '</div>' +
          '</div>' +
          '<div class="qr-wrap" title="QR preview (demo)">' +
          '<svg viewBox="0 0 33 33" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" id="' + qrId + '">' +
          '<rect width="33" height="33" fill="#fff"/>' +
          '<g fill="#0a0a0a">' +
          '<rect x="2" y="2" width="9" height="9"/><rect x="22" y="2" width="9" height="9"/><rect x="2" y="22" width="9" height="9"/>' +
          '<rect x="13" y="4" width="2" height="2"/><rect x="17" y="4" width="2" height="2"/><rect x="13" y="8" width="2" height="2"/>' +
          '<rect x="5" y="13" width="23" height="2"/><rect x="5" y="17" width="2" height="8"/><rect x="9" y="19" width="6" height="2"/>' +
          '<rect x="18" y="17" width="10" height="2"/><rect x="18" y="21" width="2" height="6"/><rect x="22" y="23" width="6" height="2"/>' +
          '</g></svg></div></article>'
        );
      }).join('');
    })();
  </script>
</body>
</html>
